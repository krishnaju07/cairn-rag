[project]
name = "cairn-rag"
version = "0.1.0"
description = "Upload documents, ask questions, get answers with citations you can open."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "numpy>=1.26",
    "fastembed>=0.5",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "py3langid>=0.3",
]

[project.optional-dependencies]
media = [
    "faster-whisper>=1.1",
    "av>=11,<17",
    "rapidocr-onnxruntime>=1.3",
]

[project.scripts]
cairn = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["schema.sql", "web/templates/**/*.html", "web/static/**/*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP006", "UP007"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"app/ingestion/catalog.py" = ["E501"]
"eval/*/build.py" = ["E501"]
